name: CI

on:
  push:
    branches: [main, bnb]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          if [ ! -f .env ]; then
            cat > .env <<'EOF'
          POSTGRES_DB=sigis
          POSTGRES_USER=sigis
          POSTGRES_PASSWORD=ci-sigis-password
          POSTGRES_PORT=5432
          FRONTEND_PORT=8080
          JWT_SECRET=ci-jwt-secret-with-at-least-32-characters
          JWT_EXPIRES_IN=8h
          FRONTEND_ORIGIN=http://localhost:8080
          EOF
          fi

      - name: Build and start services
        run: docker compose up -d --build db backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs backend db
          exit 1

      - name: Run backend tests
        run: docker compose exec -T backend npm test

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color db backend

      - name: Stop services
        if: always()
        run: docker compose down -v
