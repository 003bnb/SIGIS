<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153a62">
  <title>Connexion | SIGIS</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body class="auth-page min-h-screen px-4 py-7">
  <main class="auth-card mx-auto w-full max-w-md">
    <a class="brand brand-center" href="/"><span class="brand-mark">S</span><span>SIGIS</span></a>
    <p class="eyebrow">Espace sécurisé</p>
    <h1>Connexion</h1>
    <p class="muted">Accédez à votre espace de gestion de la scolarité.</p>
    <form id="login-form" class="stack">
      <label for="email">Adresse email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button button-primary button-wide" type="submit">Se connecter</button>
      <p class="feedback" id="login-feedback" role="status" aria-live="polite"></p>
    </form>
    <div class="auth-footer">Vous candidatez ? <a href="/admission.html">Déposer une candidature</a></div>
    <p class="demo-hint">Démo : admin@sigis.local / password</p>
  </main>
</body>
</html>
